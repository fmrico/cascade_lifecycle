name: jazzy-devel

on:
  pull_request:
    branches:
      - jazzy-devel
  push:
    branches:
      - jazzy-devel
  workflow_dispatch:
    schedule:
      - cron: '0 0 * * 0'
      
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ros-tooling/setup-ros-docker/setup-ros-docker-ubuntu-noble-ros-jazzy-ros-base:master
    steps:
      - name: Repo checkout
        uses: actions/checkout@v6
        with:
          ref: jazzy-devel
      - name: build and test
        uses: ros-tooling/action-ros-ci@0.4.8
        with:
          package-name: rclcpp_cascade_lifecycle rclpy_cascade_lifecycle cascade_lifecycle_msgs
          target-ros2-distro: jazzy
          colcon-defaults: |
            {
              "test": {
                "parallel-workers" : 1
              }
            }
          colcon-mixin-name: coverage-gcc
          colcon-mixin-repository: https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml
      - name: Codecov
        uses: codecov/codecov-action@v3.1.1
        with:
          file: ros_ws/lcov/total_coverage.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
